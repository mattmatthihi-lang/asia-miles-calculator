<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Asia Miles Calculator & Flight Award Guide | 亞洲萬里通里數換算器</title>
    <!-- Tailwind CSS for sleek responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #0f172a; /* Sophisticated Dark Theme */
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

    <!-- Top Navigation with Language Selector -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">✈️</span>
                <span class="font-bold text-xl tracking-wide bg-gradient-to-r from-teal-400 to-cyan-400 bg-clip-text text-transparent">Asia Miles Explorer</span>
            </div>
            <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-800 hover:bg-slate-700 text-teal-400 font-medium px-3.5 py-1.5 rounded-full border border-slate-700 text-sm transition duration-300">
                English
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LEFT PANEL: Controls, Wallet & Sorting (5 Cols) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Setup Section -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 backdrop-blur">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-teal-400">
                    <i class="fa-solid fa-calculator"></i> <span data-key="calcTitle">計算你的消費回報</span>
                </h2>
                
                <!-- Category Dropdown -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-400 mb-2" data-key="labelCategory">消費類別</label>
                    <select id="category" onchange="calculateAll()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-teal-400 transition">
                        <option value="local" data-key="catLocal">本地一般消費 (Local General)</option>
                        <option value="online" data-key="catOnline">網上購物 (Online Shopping)</option>
                        <option value="dining" data-key="catDining">餐飲美饌 (Dining)</option>
                        <option value="overseas" data-key="catOverseas">海外簽賬/外幣 (Overseas FX)</option>
                    </select>
                </div>

                <!-- Spend Amount Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-400 mb-2" data-key="labelAmount">預計消費金額 (HKD)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-slate-500 font-bold">$</span>
                        <input type="number" id="spendAmount" value="20000" oninput="calculateAll()" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-8 pr-4 py-3 text-slate-100 font-semibold focus:outline-none focus:border-teal-400 transition" placeholder="e.g. 15000">
                    </div>
                </div>
            </div>

            <!-- "My Wallet" Filter & Sort Cards -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 backdrop-blur">
                <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-teal-400">
                    <i class="fa-solid fa-wallet"></i> <span data-key="walletTitle">篩選我的信用卡</span>
                </h2>
                <p class="text-xs text-slate-400 mb-4" data-key="walletSubtitle">剔選你擁有的卡，或點選進行排序：</p>
                
                <!-- Wallet Checkboxes -->
                <div id="walletCheckboxes" class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-6">
                    <!-- Loaded dynamically via JS -->
                </div>

                <!-- Sort Options -->
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2" data-key="labelSort">排序方式</label>
                    <select id="sortBy" onchange="calculateAll()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-300 focus:outline-none focus:border-teal-400 transition">
                        <option value="miles-desc" data-key="sortMiles">里數由多到少 (Most Miles)</option>
                        <option value="name-asc" data-key="sortName">信用卡名稱 (Card Name)</option>
                    </select>
                </div>
            </div>

            <!-- Calculated Card Outputs -->
            <div class="space-y-4">
                <h3 class="text-md font-bold text-slate-300 flex justify-between items-center px-1">
                    <span data-key="cardRankTitle">信用卡里數回報排名</span>
                    <span class="text-xs text-slate-500" data-key="clickCardHint">*點擊卡片鎖定以查詢航點</span>
                </h3>
                <div id="cardsContainer" class="space-y-4 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Cards will be dynamically inserted here -->
                </div>
            </div>

        </div>

        <!-- RIGHT PANEL: Where Can I Fly & Redemptions (7 Cols) -->
        <div class="lg:col-span-7 space-y-6">
            
            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 backdrop-blur min-h-[500px]">
                
                <!-- Top Flight Header -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b border-slate-800 pb-5">
                    <div>
                        <h2 class="text-xl font-bold flex items-center gap-2 text-teal-400">
                            <i class="fa-solid fa-plane-departure"></i> <span data-key="flightTitle">里數飛到邊？ (Where can I fly?)</span>
                        </h2>
                        <p class="text-sm text-slate-400 mt-1">
                            <span data-key="activeCardLabel">正在查詢信用卡：</span> 
                            <span id="activeCardName" class="font-bold text-slate-200">--</span>
                        </p>
                    </div>

                    <!-- One-Way vs Round Trip Toggle -->
                    <div class="bg-slate-800 p-1 rounded-lg flex border border-slate-700">
                        <button onclick="setTripType('oneway')" id="tripOneway" class="px-4 py-1.5 rounded-md text-xs font-bold transition duration-300 bg-teal-500 text-slate-950">
                            單程 One-Way
                        </button>
                        <button onclick="setTripType('roundtrip')" id="tripRound" class="px-4 py-1.5 rounded-md text-xs font-bold transition duration-300 text-slate-400 hover:text-slate-100">
                            來回 Round-Trip
                        </button>
                    </div>
                </div>

                <!-- Flight Award Grid -->
                <div id="flightGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Destination Award Cards go here -->
                </div>

                <!-- One-Click Share Widget -->
                <div class="mt-8 p-4 bg-slate-800/40 rounded-xl border border-slate-700/50 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-teal-500/10 flex items-center justify-center text-teal-400 text-lg">
                            <i class="fa-solid fa-share-nodes"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-slate-200" data-key="shareLabel">一鍵分享試算結果</p>
                            <p class="text-xs text-slate-500" data-key="shareSub">複製里數及可換機票資訊發送給好友</p>
                        </div>
                    </div>
                    <button onclick="shareReport()" class="w-full sm:w-auto bg-gradient-to-r from-teal-500 to-cyan-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl hover:opacity-90 active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-copy"></i> <span data-key="shareBtn">複製報告 Copy Report</span>
                    </button>
                </div>

                <!-- Reference Note -->
                <p class="text-[11px] text-slate-500 mt-6 leading-relaxed">
                    * 數據基於國泰航空 2026 年最新標準飛行獎勵兌換表計算。<br>
                    * 所有換領機會以國泰航空之座位實際庫存與最後訂單為準。
                </p>
            </div>

        </div>
    </main>

    <script>
        // Dictionary for Bilingual Support (ZH/EN)
        const i18n = {
            zh: {
                calcTitle: "計算你的消費回報",
                labelCategory: "消費類別",
                labelAmount: "預計消費金額 (HKD)",
                catLocal: "本地一般消費",
                catOnline: "網上購物 / 指定網頁",
                catDining: "餐飲美饌",
                catOverseas: "海外簽賬 / 外幣",
                walletTitle: "篩選及控制",
                walletSubtitle: "勾選你持有的信用卡進行比較：",
                labelSort: "排序方式",
                sortMiles: "賺取里數：由高到低",
                sortName: "信用卡名稱：按 A-Z",
                cardRankTitle: "信用卡里數回報排名",
                clickCardHint: "*點擊卡片可鎖定為當前航點換領計算基準",
                flightTitle: "里數飛到邊？ (2026 新兌換表)",
                activeCardLabel: "當前鎖定信用卡：",
                shareLabel: "一鍵分享試算結果",
                shareSub: "複製里數及可換機票資訊發送給好友",
                shareBtn: "複製報告 Copy Report",
                reqMiles: "所需里數",
                econ: "經濟艙 (Economy)",
                pey: "特選經濟 (Premium Econ)",
                biz: "商務艙 (Business)"
            },
            en: {
                calcTitle: "Calculate Rewards",
                labelCategory: "Spending Category",
                labelAmount: "Estimated Spending (HKD)",
                catLocal: "Local General",
                catOnline: "Online Shopping / Designated",
                catDining: "Dining Out",
                catOverseas: "Overseas FX Spending",
                walletTitle: "My Wallet & Filters",
                walletSubtitle: "Select the cards you own to filter results:",
                labelSort: "Sort By",
                sortMiles: "Miles Earned: High to Low",
                sortName: "Card Name: A to Z",
                cardRankTitle: "Credit Card Miles Ranking",
                clickCardHint: "*Click any card to lock it for flight comparisons",
                flightTitle: "Where Can I Fly? (2026 Chart)",
                activeCardLabel: "Active Compare Card:",
                shareLabel: "Share Result Report",
                shareSub: "Copy calculated miles and flights to clipboard",
                shareBtn: "Copy Report",
                reqMiles: "Miles Required",
                econ: "Economy Class",
                pey: "Premium Econ",
                biz: "Business Class"
            }
        };

        let currentLang = 'zh';
        let tripType = 'oneway'; 
        let activeCardId = 'everymile';

        // Official 2026 Standard Flight Award Charts (Cathay Flights)
        const destinations = [
            { 
                id: "tpe", 
                cityZh: "台北 / 高雄 / 河內 / 馬尼拉", 
                cityEn: "Taipei / Kaohsiung / Hanoi", 
                zone: "Ultra-Short", 
                miles: { econ: 7000, pey: 11000, biz: 16000 },
                img: "✈️"
            },
            { 
                id: "icn", 
                cityZh: "首爾 / 曼谷 / 新加坡 / 吉隆坡 / 北京 / 上海", 
                cityEn: "Seoul / Bangkok / Singapore / Beijing", 
                zone: "Short (Type 1)", 
                miles: { econ: 9000, pey: 18000, biz: 27000 },
                img: "🍜"
            },
            { 
                id: "tyo", 
                cityZh: "東京 / 大阪 / 札幌 / 峇里島 / 雅加達", 
                cityEn: "Tokyo / Osaka / Sapporo / Bali", 
                zone: "Short (Type 2)", 
                miles: { econ: 13000, pey: 23000, biz: 33000 },
                img: "🍣"
            },
            { 
                id: "syd", 
                cityZh: "悉尼 / 墨爾本 / 杜拜", 
                cityEn: "Sydney / Melbourne / Dubai", 
                zone: "Medium", 
                miles: { econ: 20000, pey: 39000, biz: 60000 },
                img: "🦘"
            },
            { 
                id: "lhr", 
                cityZh: "倫敦 / 巴黎 / 溫哥華 / 三藩市 / 洛杉磯 / 奧克蘭", 
                cityEn: "London / Paris / Vancouver / SF / LA", 
                zone: "Long", 
                miles: { econ: 27000, pey: 52000, biz: 91000 },
                img: "🎡"
            },
            { 
                id: "jfk", 
                cityZh: "紐約 / 波士頓 / 多倫多 / 芝加哥", 
                cityEn: "New York / Boston / Toronto", 
                zone: "Ultra-Long", 
                miles: { econ: 38000, pey: 78000, biz: 119000 },
                img: "🗽"
            }
        ];

        // HK Credit Cards Configuration & Earn Rates (All 11 Cards)
        const creditCards = [
            {
                id: "everymile",
                nameZh: "滙豐 EveryMile 信用卡",
                nameEn: "HSBC EveryMile Credit Card",
                theme: "from-emerald-950 to-emerald-800 border-emerald-600",
                badgeBg: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
                rates: { local: 5, online: 2, dining: 2, overseas: 5 } // $2/mile transit/coffee
            },
            {
                id: "sc-cathay",
                nameZh: "渣打國泰 Mastercard",
                nameEn: "SCB Cathay Mastercard",
                theme: "from-teal-950 to-cyan-900 border-teal-600",
                badgeBg: "bg-teal-500/20 text-teal-300 border-teal-500/30",
                rates: { local: 6, online: 4, dining: 4, overseas: 4 }
            },
            {
                id: "amex-explorer",
                nameZh: "美國運通 Explorer 信用卡",
                nameEn: "AMEX Explorer Credit Card",
                theme: "from-slate-900 to-indigo-950 border-indigo-700",
                badgeBg: "bg-indigo-500/20 text-indigo-300 border-indigo-500/30",
                rates: { local: 5, online: 5, dining: 5, overseas: 3.33 }
            },
            {
                id: "hsbc-red",
                nameZh: "滙豐 Red 信用卡",
                nameEn: "HSBC Red Credit Card",
                theme: "from-red-950 to-rose-900 border-red-700",
                badgeBg: "bg-red-500/20 text-rose-300 border-red-500/30",
                rates: { local: 25, online: 2.5, dining: 25, overseas: 10 }
            },
            {
                id: "citi-pm",
                nameZh: "花旗 PremierMiles 信用卡",
                nameEn: "Citi PremierMiles Card",
                theme: "from-sky-950 to-blue-900 border-blue-700",
                badgeBg: "bg-blue-500/20 text-blue-300 border-blue-500/30",
                rates: { local: 8, online: 8, dining: 8, overseas: 3 }
            },
            {
                id: "dbs-black",
                nameZh: "星展 Black World Mastercard",
                nameEn: "DBS Black World Mastercard",
                theme: "from-neutral-900 to-zinc-950 border-zinc-700",
                badgeBg: "bg-zinc-500/20 text-zinc-300 border-zinc-500/30",
                rates: { local: 6, online: 6, dining: 6, overseas: 4 }
            },
            {
                id: "hsbc-vs",
                nameZh: "滙豐 Visa Signature 信用卡",
                nameEn: "HSBC Visa Signature",
                theme: "from-rose-950 to-pink-900 border-rose-600",
                badgeBg: "bg-rose-500/20 text-pink-300 border-rose-500/30",
                rates: { local: 15, online: 2.78, dining: 2.78, overseas: 5.6 } // Assumes Red Hot Category allocated
            },
            {
                id: "hangseng-travel",
                nameZh: "恒生 Travel+ 信用卡",
                nameEn: "Hang Seng Travel+ Card",
                theme: "from-green-950 to-emerald-950 border-green-600",
                badgeBg: "bg-green-500/20 text-green-300 border-green-500/30",
                rates: { local: 15, online: 15, dining: 5, overseas: 5 } // 7% overseas rebate is roughly equivalent to $5/mile
            },
            {
                id: "hangseng-mmpower",
                nameZh: "恒生 MMPOWER 信用卡",
                nameEn: "Hang Seng MMPOWER Card",
                theme: "from-cyan-950 to-blue-950 border-cyan-600",
                badgeBg: "bg-cyan-500/20 text-cyan-300 border-cyan-500/30",
                rates: { local: 15, online: 5, dining: 5, overseas: 5 }
            },
            {
                id: "boc-cheer",
                nameZh: "中銀 Cheers Card (Visa Infinite)",
                nameEn: "BOC Cheers Card (Visa Infinite)",
                theme: "from-red-950 to-amber-950 border-amber-600",
                badgeBg: "bg-amber-500/20 text-amber-300 border-amber-500/30",
                rates: { local: 15, online: 15, dining: 1.5, overseas: 1.5 } // Unbeatable dining/foreign spending multiplier
            },
            {
                id: "bea-world",
                nameZh: "東亞 BEA World Mastercard",
                nameEn: "BEA World Mastercard",
                theme: "from-yellow-950 to-stone-900 border-yellow-700",
                badgeBg: "bg-yellow-500/20 text-yellow-300 border-yellow-500/30",
                rates: { local: 8, online: 8, dining: 8, overseas: 4 }
            }
        ];

        // Track owned cards in Wallet (defaults to true for all initially)
        let ownedCards = {
            "everymile": true,
            "sc-cathay": true,
            "amex-explorer": true,
            "hsbc-red": true,
            "citi-pm": true,
            "dbs-black": true,
            "hsbc-vs": true,
            "hangseng-travel": true,
            "hangseng-mmpower": true,
            "boc-cheer": true,
            "bea-world": true
        };

        // Initialize App
        window.onload = function() {
            buildWalletCheckboxes();
            calculateAll();
        };

        // Render Wallet Filters dynamically
        function buildWalletCheckboxes() {
            const container = document.getElementById('walletCheckboxes');
            container.innerHTML = '';
            
            creditCards.forEach(card => {
                const checked = ownedCards[card.id] ? 'checked' : '';
                container.innerHTML += `
                    <label class="flex items-center space-x-2 text-slate-300 hover:text-slate-100 cursor-pointer text-xs">
                        <input type="checkbox" id="chk-${card.id}" ${checked} onchange="toggleWalletCard('${card.id}')" 
                               class="rounded bg-slate-800 border-slate-700 text-teal-500 focus:ring-teal-500">
                        <span class="truncate">${currentLang === 'zh' ? card.nameZh : card.nameEn}</span>
                    </label>
                `;
            });
        }

        // Toggle wallet visibility
        function toggleWalletCard(id) {
            ownedCards[id] = document.getElementById(`chk-${id}`).checked;
            
            // If active locked card is unchecked, set it to the first available owned card
            if (!ownedCards[activeCardId]) {
                const firstOwned = Object.keys(ownedCards).find(k => ownedCards[k]);
                activeCardId = firstOwned || 'everymile';
            }
            calculateAll();
        }

        // Language Switcher
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'English' : '繁體中文';
            
            // Translate UI Strings
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
            
            buildWalletCheckboxes();
            calculateAll();
        }

        // Trip Type Toggle (One-Way vs Round Trip)
        function setTripType(type) {
            tripType = type;
            const btnOne = document.getElementById('tripOneway');
            const btnRound = document.getElementById('tripRound');

            if (type === 'oneway') {
                btnOne.className = "px-4 py-1.5 rounded-md text-xs font-bold transition duration-300 bg-teal-500 text-slate-950";
                btnRound.className = "px-4 py-1.5 rounded-md text-xs font-bold transition duration-300 text-slate-400 hover:text-slate-100";
            } else {
                btnRound.className = "px-4 py-1.5 rounded-md text-xs font-bold transition duration-300 bg-teal-500 text-slate-950";
                btnOne.className = "px-4 py-1.5 rounded-md text-xs font-bold transition duration-300 text-slate-400 hover:text-slate-100";
            }
            calculateAll();
        }

        // Core Calculation & UI Render Function
        function calculateAll() {
            const amount = parseFloat(document.getElementById('spendAmount').value) || 0;
            const cat = document.getElementById('category').value;
            const sortBy = document.getElementById('sortBy').value;
            
            // 1. Calculate and build card data objects
            let processedCards = creditCards.map(card => {
                const rate = card.rates[cat];
                const miles = Math.floor(amount / rate);
                return {
                    ...card,
                    miles: miles,
                    rateVal: rate
                };
            });

            // 2. Filter out non-owned cards
            processedCards = processedCards.filter(card => ownedCards[card.id]);

            // 3. Sort Cards
            if (sortBy === 'miles-desc') {
                processedCards.sort((a, b) => b.miles - a.miles);
            } else if (sortBy === 'name-asc') {
                processedCards.sort((a, b) => {
                    const nameA = currentLang === 'zh' ? a.nameZh : a.nameEn;
                    const nameB = currentLang === 'zh' ? b.nameZh : b.nameEn;
                    return nameA.localeCompare(nameB);
                });
            }

            // 4. Render Card Results List
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = '';

            if (processedCards.length === 0) {
                cardsContainer.innerHTML = `
                    <div class="text-center py-6 text-slate-500 text-sm">
                        請勾選至少一張信用卡以顯示結果
                    </div>
                `;
                document.getElementById('activeCardName').innerText = "--";
                document.getElementById('flightGrid').innerHTML = '';
                return;
            }

            // Make sure the active compared card is valid & exists in the filtered results
            let activeCard = processedCards.find(c => c.id === activeCardId) || processedCards[0];
            activeCardId = activeCard.id;
            
            document.getElementById('activeCardName').innerText = currentLang === 'zh' ? activeCard.nameZh : activeCard.nameEn;

            processedCards.forEach(card => {
                const isSelected = card.id === activeCardId;
                const cardName = currentLang === 'zh' ? card.nameZh : card.nameEn;
                const selectedBorder = isSelected ? 'ring-2 ring-teal-400 ring-offset-2 ring-offset-slate-900' : '';
                
                cardsContainer.innerHTML += `
                    <div onclick="selectActiveCard('${card.id}')" 
                         class="relative cursor-pointer transition duration-300 transform hover:-translate-y-0.5 rounded-2xl bg-gradient-to-br ${card.theme} p-4 border shadow-lg flex justify-between items-center ${selectedBorder}">
                        <div class="truncate mr-2">
                            <span class="inline-block px-2 py-0.5 rounded-full text-[9px] font-bold tracking-wider border mb-1.5 ${card.badgeBg}">
                                HK$${card.rateVal}/Mile
                            </span>
                            <h4 class="font-bold text-slate-100 text-sm truncate">${cardName}</h4>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="text-[10px] text-slate-400">Earned Miles</p>
                            <p class="text-xl font-black text-teal-300 font-mono">${card.miles.toLocaleString()}</p>
                        </div>
                    </div>
                `;
            });

            // 5. Render "Where Can I Fly" Destinations based on Active Card Miles
            const userMiles = activeCard.miles;
            const flightGrid = document.getElementById('flightGrid');
            flightGrid.innerHTML = '';

            destinations.forEach(dest => {
                const title = currentLang === 'zh' ? dest.cityZh : dest.cityEn;
                
                // Adjust requirements based on One-way / Round-trip
                const mul = tripType === 'roundtrip' ? 2 : 1;
                const econReq = dest.miles.econ * mul;
                const peyReq = dest.miles.pey * mul;
                const bizReq = dest.miles.biz * mul;

                // Pick the cabin the user is targeting
                const econPct = Math.min(100, Math.floor((userMiles / econReq) * 100));
                const peyPct = Math.min(100, Math.floor((userMiles / peyReq) * 100));
                const bizPct = Math.min(100, Math.floor((userMiles / bizReq) * 100));

                flightGrid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 hover:border-slate-700 transition">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${dest.img}</span>
                            <div>
                                <h4 class="font-bold text-slate-100 text-sm md:text-base">${title}</h4>
                                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700 font-medium">
                                    ${dest.zone}
                                </span>
                            </div>
                        </div>

                        <!-- Progress Section -->
                        <div class="space-y-3.5 pt-2">
                            <!-- Economy class -->
                            ${renderCabinRow(i18n[currentLang].econ, userMiles, econReq, econPct, 'bg-emerald-500')}
                            <!-- Premium Economy class -->
                            ${renderCabinRow(i18n[currentLang].pey, userMiles, peyReq, peyPct, 'bg-cyan-500')}
                            <!-- Business class -->
                            ${renderCabinRow(i18n[currentLang].biz, userMiles, bizReq, bizPct, 'bg-indigo-500')}
                        </div>
                    </div>
                `;
            });
        }

        // Set the current focused card
        function selectActiveCard(id) {
            activeCardId = id;
            calculateAll();
        }

        // Render sub-row details of required miles with target values
        function renderCabinRow(label, currentMiles, requiredMiles, percentage, progressColor) {
            const isCompleted = currentMiles >= requiredMiles;
            const badge = isCompleted 
                ? `<span class="text-[10px] text-emerald-400 font-extrabold flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> Ready</span>`
                : `<span class="text-[10px] text-slate-500">${percentage}%</span>`;

            return `
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">${label}</span>
                        <span class="font-semibold text-slate-200 font-mono">${requiredMiles.toLocaleString()} ${badge}</span>
                    </div>
                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div class="${progressColor} h-full transition-all duration-500" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        }

        // Clipboard Share Reporting System
        function shareReport() {
            const activeCard = creditCards.find(c => c.id === activeCardId);
            const amount = parseFloat(document.getElementById('spendAmount').value) || 0;
            const cat = document.getElementById('category').value;
            const catText = i18n[currentLang][`cat${cat.charAt(0).toUpperCase() + cat.slice(1)}`];
            
            const miles = activeCard.miles || Math.floor(amount / activeCard.rates[cat]);
            const formattedMiles = miles.toLocaleString();

            let shareText = "";
            if (currentLang === 'zh') {
                shareText = `✈️ 【我的里數旅遊試算報告】\n`;
                shareText += `💳 使用卡片: ${activeCard.nameZh}\n`;
                shareText += `💰 預計簽賬: HK$${amount.toLocaleString()} (${catText})\n`;
                shareText += `🎯 預計賺取: ${formattedMiles} Asia Miles！\n\n`;
                shareText += `💡 換領潛力：\n`;
                destinations.forEach(d => {
                    if (miles >= d.miles.econ) {
                        shareText += `✅ 可兌換到 ${d.cityZh} 單程經濟艙 (${d.miles.econ.toLocaleString()} 里數)\n`;
                    }
                });
            } else {
                shareText = `✈️ [My Asia Miles Flight Report]\n`;
                shareText += `💳 Card: ${activeCard.nameEn}\n`;
                shareText += `💰 Spend Amount: HK$${amount.toLocaleString()} on ${catText}\n`;
                shareText += `🎯 Miles Earned: ${formattedMiles} Miles!\n\n`;
                shareText += `💡 Travel Potentials:\n`;
                destinations.forEach(d => {
                    if (miles >= d.miles.econ) {
                        shareText += `✅ Ready to fly Economy class to ${d.cityEn} (Requires ${d.miles.econ.toLocaleString()} miles)\n`;
                    }
                });
            }

            shareText += `\n立即使用網頁版計算機： ${window.location.origin + window.location.pathname}`;

            navigator.clipboard.writeText(shareText).then(() => {
                alert(currentLang === 'zh' ? '✅ 報告已成功複製到剪貼簿！' : '✅ Report successfully copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy text', err);
            });
        }
    </script>
</body>
</html>
